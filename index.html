<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inequality In Sports</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="frontpage">
        <header>
            <div id="title">
                <h1>Who's Your Overwhelming Underdog?</h1>
            </div>
            <div id="subtitle">
                <h2>You've probably heard of these athletes before. Which player are you the most like? Take this quiz and find out!</h2>
            </div>
        </header>
        <div class="information">
            <div class="slideshow">
                <div class="slideshow-track">
                    <!-- First set of athlete images -->
                    <img src="frances-tiafoe.png" alt="Frances Tiafoe" class="slide-img">
                    <img src="giannis-antetokounmpo.png" alt="Giannis Antetokounmpo" class="slide-img">
                    <img src="naomi-osaka.png" alt="Naomi Osaka" class="slide-img">
                    <img src="lia-thomas.png" alt="Lia Thomas" class="slide-img">
                    <img src="cristiano-ronaldo.png" alt="Cristiano Ronaldo" class="slide-img">
                    <img src="michael-jordan.png" alt="Michael Jordan" class="slide-img">
                    <img src="derek-jeter.png" alt="Derek Jeter" class="slide-img">
                    <img src="luis-diaz.png" alt="Luis Diaz" class="slide-img">
                    <img src="novak-djokovic.png" alt="Novak Djokovic" class="slide-img">
                    <img src="simone-biles.png" alt="Simone Biles" class="slide-img">
                    <img src="ilona-maher.png" alt="Ilona Maher" class="slide-img">
                    <img src="wilma-rudolph.png" alt="Wilma Rudolph" class="slide-img">
                    <img src="xander-bogaerts.png" alt="Xander Bogaerts" class="slide-img">
                    
                    
                    <!-- Exact duplicate set for a seamless infinite loop -->
                    <img src="frances-tiafoe.png" alt="Frances Tiafoe" class="slide-img">
                    <img src="giannis-antetokounmpo.png" alt="Giannis Antetokounmpo" class="slide-img">
                    <img src="naomi-osaka.png" alt="Naomi Osaka" class="slide-img">
                    <img src="lia-thomas.png" alt="Lia Thomas" class="slide-img">
                    <img src="cristiano-ronaldo.png" alt="Cristiano Ronaldo" class="slide-img">
                    <img src="michael-jordan.png" alt="Michael Jordan" class="slide-img">
                    <img src="derek-jeter.png" alt="Derek Jeter" class="slide-img">
                    <img src="luis-diaz.png" alt="Luis Diaz" class="slide-img">
                    <img src="novak-djokovic.png" alt="Novak Djokovic" class="slide-img">
                    <img src="simone-biles.png" alt="Simone Biles" class="slide-img">
                    <img src="ilona-maher.png" alt="Ilona Maher" class="slide-img">
                    <img src="wilma-rudolph.png" alt="Wilma Rudolph" class="slide-img">
                    <img src="xander-bogaerts.png" alt="Xander Bogaerts" class="slide-img">
                </div>
            </div>
        </div>
        <button type="button" id="startButton">
            Start!
        </button>
    </div>
    <!-- Quiz container -->
    <div id="quiz-container" class="hidden">
        <div id="question-box">
            <h2 id="question-text">Loading question...</h2>
            <div id="options-container">
                <!-- Option buttons get generated here -->
            </div>
        </div>

        <div id="result-box" class="hidden">
            <h2 id="result-title">Your Result:</h2>
            <img id="result-image" src="" alt="Winning Athlete" class="athlete-img">
            <p id="result-description"></p>
            <button id="restart-btn">Retake Quiz</button>
            <button id="learn-btn">Learn More</button>
            <button id="back-to-grid-btn" class="hidden">Back to All Athletes</button>
        </div>
    </div>

    <!-- Athletes grid page (outside #quiz-container so hiding #quiz-container doesn't hide this) -->
    <div id="athletes-page" class="hidden">
        <h2>Meet the Underdogs</h2>
        <p>Click on an athlete to learn more about their story.</p>

        <div id="athletes-grid"></div>

        <button id="back-to-results-btn">Back to Results</button>
        <button id="restart-btn-grid">Retake Quiz</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
